<script>
'use strict';
const dictionary = JSON.parse(document.getElementById('dictionary').textContent);
const norm = value => String(value ?? '').normalize('NFKC').toLocaleLowerCase('ru').replace(/ё/g,'е').replace(/\s+/g,' ').trim();
const brandKey = value => norm(value).replace(/^[«"“]+|[!»"”.]+$/g,'').trim();
const aliases = new Map();
for (const [name, spellings] of Object.entries(dictionary)) {
  for (const spelling of [name,...spellings]) aliases.set(brandKey(spelling),name);
}
function brandName(value) {
  const label = String(value ?? '').trim();
  return aliases.get(brandKey(label)) || label;
}
const wordForm = s => norm(s).replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const titleDictionary = [...aliases.entries()].map(([k,v])=>[wordForm(k),v]).filter(([k])=>k.length>=2);
function titleBrands(title) {
  const words = ' '+wordForm(title)+' ';
  return [...new Set(titleDictionary.filter(([key])=>words.includes(' '+key+' ')).map(([,name])=>name))];
}
function parseCSV(text) {
  text = text.replace(/^\uFEFF/,'');
  if (/^\s*</.test(text)) throw Error('Получена HTML-страница вместо CSV.');
  const first = text.split(/\r?\n/,1)[0];
  const delimiter = [';',',','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[]; let row=[], field='', quoted=false;
  const endRow=()=>{row.push(field); if(row.some(v=>v.trim()!=='')) rows.push(row); row=[]; field='';};
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){
      if(ch!=='"'){field+=ch;continue;}
      if(text[i+1]==='"'){field+='"';i++;} else quoted=false;
    } else if(ch==='"' && field==='') quoted=true;
    else if(ch===delimiter){row.push(field);field='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;endRow();}
    else field+=ch;
  }
  if(quoted) throw Error('Незакрытая кавычка в CSV.');
  endRow();
  if(!rows.length) throw Error('CSV пуст.');
  if(rows.some(r=>r.length!==rows[0].length)) throw Error('В строках CSV разное количество полей. Проверьте разделитель и кавычки.');
  return rows;
}
function host(label,url){
  for (const candidate of [url,label]) {
    if(!candidate)continue;
    try{const s=String(candidate).trim();const u=new URL(s.includes('://')?s:'https://'+s);
      if(u.hostname.includes('.')&&!/\s/.test(s.split('/')[0]))return u.hostname.toLowerCase().replace(/^www\./,'');
    }catch{}
  }
  return '';
}
function priceRub(text){
  if(!text || /[$€₸₴]|USD|EUR|BYN|KZT|UAH|бел\.|тенге|сом/i.test(text))return null;
  const match=String(text).trim().match(/^(\d[\d \u00a0\u202f]*(?:[.,]\d{1,2})?)\s*(?:₽|руб\.?|RUB)$/i);
  return match ? Number(match[1].replace(/\s/g,'').replace(',','.')) : null;
}
function schemaFor(headers){
  const has=rx=>headers.some(h=>rx.test(h));
  return {pBrand:has(/^products\[\d+\]\.brands(?:\[|$)/),kind:has(/^alice_brands\[\d+\]\.kind$/),
    price:has(/^products\[\d+\]\.price$/),seller:has(/^products\[\d+\]\.seller$/),
    promo:has(/^products\[\d+\]\.promo_signal$/),webDomain:has(/^web_results\[\d+\]\.(?:url|domain|host)$/)};
}
function buildDataset(matrix) {
  if(!Array.isArray(matrix)||!matrix.length)throw Error('Нет заголовков CSV.');
  const headers=matrix[0].map(h=>String(h).trim());
  if (!headers.includes('query') || !headers.includes('status') ||
      !headers.includes('product_status') || !headers.includes('alice_status'))
    throw Error('Нужны колонки query, status, product_status и alice_status из отчёта мониторинга.');
  if(new Set(headers).size!==headers.length)throw Error('Заголовки колонок повторяются.');
  const schema=schemaFor(headers);
  const columns=headers.map((h,i)=>{
    const m=/^(products|alice_brands|alice_sources|web_results)\[(\d+)\]\.(\w+)(?:\[(\d+)\])?$/.exec(h);
    return m?{i,group:m[1],idx:Number(m[2]),key:m[3],sub:m[4]}:null;
  }).filter(Boolean);
  const basic = new Map(headers.map((h,i)=>[h,i]));
  const records=matrix.slice(1).map((cells,id)=>{
    const value=k=>String(cells[basic.get(k)]??'').trim();
    const query=value('query');
    if(!query)throw Error('Пустой query в строке данных '+(id+1)+'.');
    const groups={products:new Map(),alice_brands:new Map(),web_results:new Map(),alice_sources:new Map()};
    for(const col of columns){
      const v=String(cells[col.i]??'').trim();
      if(!v||v==='[]'||v==='null'||v==='{}')continue;
      let item=groups[col.group].get(col.idx);
      if(!item){item={idx:col.idx,brands:[]};groups[col.group].set(col.idx,item);}
      if(col.key==='brands'){
        if(col.sub)item.brands.push(v);
        else {let more;try{more=JSON.parse(v);}catch{} item.brands.push(...(Array.isArray(more)?more:[v]));}
      }else if(['rank','title','price','seller','group','group_title','promo_signal','kind','brand','section','evidence','domain','host','label','url','href'].includes(col.key))item[col.key]=v;
    }
    const ordered=k=>[...groups[k].values()].sort((a,b)=>a.idx-b.idx);
    return projectRecord(id,query,value,ordered,schema);
  });
  return {schema,records};
}
function projectRecord(id,query,value,ordered,schema){
  const products=ordered('products').filter(p=>p.title||p.brands?.length).map(p=>({
    title:p.title||'',brands:[...new Set((schema.pBrand?(p.brands||[]):titleBrands(p.title)).map(brandName).filter(Boolean))],
    rank:Number(p.rank)>0?Number(p.rank):p.idx,group:String(p.group??''),groupTitle:p.group_title||'',
    price:p.price||'',seller:p.seller||'',promo:/^(true|1|да)$/i.test(p.promo_signal)?true:/^(false|0|нет)$/i.test(p.promo_signal)?false:null
  }));
  const alice=ordered('alice_brands').filter(a=>a.brand).map(a=>({brand:brandName(a.brand),kind:norm(a.kind)||'unknown',pos:a.idx,section:a.section||'',evidence:a.evidence||''}));
  const web=ordered('web_results').filter(w=>w.title||w.url).map(w=>({
    title:w.title||'',rank:Number(w.rank)>0?Number(w.rank):w.idx,site:host(w.domain||w.host,w.domain||w.host||w.url)
  }));
  const sources=ordered('alice_sources').map(s=>host(s.label,s.href)||s.label||'').filter(Boolean);
  const ts=value('timestamp_utc'); let date='';
  if(ts && Number.isFinite(Date.parse(ts)))date=new Date(ts).toISOString().slice(0,10);
  return {id,number:value('number'),engine:value('engine')||'не указан',query,ts,date,status:norm(value('status'))||'unknown',
    ps:norm(value('product_status'))||'unknown',as:norm(value('alice_status'))||'unknown',products,alice,web,sources,region:value('returned_lr')};
}
const collator=new Intl.Collator('ru',{sensitivity:'base',numeric:true});
const ok=r=>r.status==='ok', prodOK=r=>ok(r)&&r.ps==='observed', aliceOK=r=>ok(r)&&r.as==='observed';
const selectedAlice=(r,mode)=>r.alice.filter(a=>mode==='all'||a.kind==='recommendation');
function increment(map,key){map.set(key,(map.get(key)||0)+1);}
function review(rows,mode){
  const stats=new Map(),products=new Map(),sellers=new Map(),sites=new Map(),sources=new Map(),titles=new Map();
  let pMeasured=0,aMeasured=0,pBase=0,aBase=0,success=0,cards=0,unknown=0,promo=0,knownPromo=0,pair=0,comatch=0,anyAlice=0;
  function brand(name){
    const k=brandKey(name);
    if(!stats.has(k))stats.set(k,{k,name,p:0,a:0,cards:0,top:0,bestSum:0,aSum:0,aFirst:0,both:0,mentions:0});
    return stats.get(k);
  }
  for(const row of rows){
    if(!ok(row))continue;
    success++;
    if(['observed','not_detected'].includes(row.ps))pMeasured++;
    if(['observed','not_detected'].includes(row.as))aMeasured++;
    const searchSeen=new Map(),aliceSeen=new Map();
    if(prodOK(row)){
      pBase++;
      const perProduct=new Set();
      for(const p of row.products){
        cards++;
        if(!p.brands.length)unknown++;
        if(p.promo!==null){knownPromo++;if(p.promo)promo++;}
        if(p.seller)increment(sellers,p.seller);
        const key=norm(p.title);
        if(key){
          if(!products.has(key))products.set(key,{name:p.title,brands:new Set(),n:0,runs:0,top:0,sum:0,prices:[]});
          const item=products.get(key);item.n++;item.sum+=p.rank;if(p.rank===1)item.top++;
          if(!perProduct.has(key)){item.runs++;perProduct.add(key);}
          for(const b of p.brands)item.brands.add(brand(b).name);
          const price=priceRub(p.price);if(price!==null)item.prices.push(price);
        }
        for(const k of new Set(p.brands.map(b=>brand(b).k))){
          stats.get(k).cards++;searchSeen.set(k,Math.min(p.rank,searchSeen.get(k)??Infinity));
        }
      }
      for(const [k,rank] of searchSeen){const b=stats.get(k);b.p++;b.bestSum+=rank;if(rank===1)b.top++;}
    }
    if(aliceOK(row)){
      aBase++;
      for(const a of row.alice)brand(a.brand).mentions++;
      for(const a of selectedAlice(row,mode)){
        const b=brand(a.brand);aliceSeen.set(b.k,Math.min(a.pos,aliceSeen.get(b.k)??Infinity));
      }
      if(aliceSeen.size)anyAlice++;
      for(const [k,pos] of aliceSeen){const b=stats.get(k);b.a++;b.aSum+=pos;if(pos===1)b.aFirst++;}
      for(const s of new Set(row.sources))increment(sources,s);
    }
    if(prodOK(row)&&aliceOK(row)){
      pair++;let same=false;for(const k of searchSeen.keys())if(aliceSeen.has(k)){stats.get(k).both++;same=true;}
      if(same)comatch++;
    }
    for(const w of row.web){
      if(w.title)increment(titles,w.title);
      if(w.site)increment(sites,w.site);
    }
  }
  return {stats,products,sellers,sites,sources,titles,pMeasured,aMeasured,pBase,aBase,success,cards,unknown,promo,knownPromo,pair,comatch,anyAlice};
}

<script>
function parseMonitorJSON(text){
  const original=JSON.parse(text);
  if(!Array.isArray(original))throw Error('Ожидается JSON-массив замеров, созданный merge_json.py.');
  const groups=['products','alice_brands','web_results','alice_sources'];
  const schema={pBrand:false,kind:false,price:false,seller:false,promo:false,webDomain:false};
  const isObject=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
  const stringField={products:'title',alice_brands:'brand',web_results:'title',alice_sources:'label'};
  const nested=original.map((row,i)=>{
    if(!isObject(row)||typeof row.query!=='string'||!row.query.trim())throw Error('Запись '+(i+1)+': ожидается объект с текстовым полем query.');
    const result={};
    for(const group of groups){
      const values=row[group]??[];
      if(!Array.isArray(values))throw Error('Запись '+(i+1)+': поле '+group+' должно быть массивом.');
      result[group]=values.map((value,j)=>{
        if(typeof value==='string')return {idx:j+1,[stringField[group]]:value};
        if(!isObject(value))throw Error('Запись '+(i+1)+': неверный элемент '+group+'['+(j+1)+'].');
        const item={...value,idx:j+1};
        if(group==='products'){
          schema.pBrand ||= Object.hasOwn(item,'brands');
          schema.price  ||= Object.hasOwn(item,'price');
          schema.seller ||= Object.hasOwn(item,'seller');
          schema.promo  ||= Object.hasOwn(item,'promo_signal');
          if(typeof item.brands==='string')item.brands=[item.brands];
          if(item.brands!=null&&(!Array.isArray(item.brands)||item.brands.some(b=>typeof b!=='string')))
            throw Error('Запись '+(i+1)+': brands у товара '+(j+1)+' должен содержать названия брендов.');
        }
        if(group==='alice_brands')schema.kind ||= Object.hasOwn(item,'kind');
        if(group==='web_results')schema.webDomain ||= ['url','host','domain'].some(k=>Object.hasOwn(item,k));
        return item;
      });
    }
    return result;
  });
  const records=original.map((row,id)=>projectRecord(id,row.query.trim(),k=>String(row[k]??'').trim(),k=>nested[id][k],schema));
  return {schema,records,original,sourceText:text};
}
function readReport(text,filename=''){
  const clean=text.replace(/^\uFEFF/,'');
  if(/^\s*[\[{]/.test(clean)||/\.json$/i.test(filename))return parseMonitorJSON(clean);
  if(/^\s*</.test(clean))throw Error('Получена страница просмотра. Выберите скачанный JSON или CSV.');
  return buildDataset(parseCSV(clean));
}

  for(const [query,subgroup] of group.questions){
    byQuestion.set(norm(query),{query,category:group.name,subgroup});

}
const unassigned='Вне справочника';
function categoryOf(row){return byQuestion.get(norm(row.query))?.category||unassigned;}
function groupOf(row){return byQuestion.get(norm(row.query))?.subgroup||'';}
function groupBy(items,key){
  const groups=new Map();
  for(const item of items){
    const value=key(item);
    if(!groups.has(value))groups.set(value,[]);
    groups.get(value).push(item);
  }
  return groups;

function productFormat(p){

function bestEntries(entries,getCount){

function brandReach(brand){return brand.p+brand.a-brand.both;}
function formatStats(rows){
  const columns=new Map(),brands=new Map();
  function record(label,names){
    increment(columns,label);
    const unique=new Set();
    for(const name of names){
      const k=brandKey(name);if(!k||unique.has(k))continue;
      unique.add(k);
      if(!brands.has(k))brands.set(k,{name,k,counts:new Map()});
      increment(brands.get(k).counts,label);
    }
  }

    if(!ok(row))continue;
    if(prodOK(row))for(const [format,items] of groupBy(row.products,productFormat)){
      record(format,items.flatMap(p=>p.brands));
    }
    if(aliceOK(row)){
      record('Алиса · рекомендации',row.alice.filter(a=>a.kind==='recommendation').map(a=>a.brand));

    }
    if(row.web.length)record('Веб · заголовки',row.web.flatMap(webBrands));

}
function seriesByQuery(rows){
  return [...groupBy(rows,r=>norm(r.query)).values()].map(measurements=>{
    const firstProducts=new Map(),recommended=new Map();
    for(const r of measurements){
      if(prodOK(r))for(const title of new Set(r.products.filter(p=>p.rank===1&&p.title).map(p=>p.title)))increment(firstProducts,title);
      if(aliceOK(r))for(const b of new Set(selectedAlice(r,'rec').map(a=>brandKey(a.brand))))increment(recommended,b);
    }
    return {measurements,firstProducts,recommended};
  });
}

  return coveragePanel(rows)+'<section class="panel"><div class="panelhead"><div><h2>Динамика по дням</h2>'+note('Дни по UTC. Доли рассчитаны отдельно для каждого дня и канала.')+'</div><div class="controls">'+modeControl()+pick+'</div></div>'+table(['Дата','Замеры','Успешные','С товарами','С Алисой','Поиск · замеры с брендом','Алиса · ответы с брендом'],trend)+stabilityPanel(rows,trendBrand)+'</section><div class="pair">'+
    panel('Статусы сбора','Все строки, в том числе ошибки и запросы без блока.',table(['Блок и статус','Замеры'],topMap(statuses).map(([k,v])=>[cell(k),num(v)])))+
    panel('Типы записей Алисы','Считаются все записи с названием бренда в обнаруженных ответах.',table(['Тип','Записи'],topMap(kinds).map(([k,v])=>[cell(namesOfKinds[k]||k),num(v)])))+'</div>'+
    panel('Как читать показатели','Охват зависит от глубины сбора и словаря брендов.', '<ul class="method"><li>На главном графике у обоих каналов одна база — все успешные замеры выбранного среза. В таблице брендов показатель «Доля выдач с товарами» использует только успешные замеры с product_status = observed. Для Алисы это успешные замеры с alice_status = observed, в том числе ответы без брендов. Знак «—» означает, что показатель недоступен.</li><li>Повторные карточки одного бренда увеличивают показы. В охвате бренда и в совпадениях между каналами один замер даёт максимум единицу. В среднюю лучшую позицию входит минимальный rank бренда в каждом замере, где он появился.</li><li>Названия сопоставляются по регистру, пробелам, конечной пунктуации и словарю вариантов написания. Если в файле есть поля brands, пустая ячейка сохраняет статус «бренд не определён». При полном отсутствии колонок brands применяется словарь к названию товара.</li><li>Число строк измеряет частоту в собранной выборке. Все замеры имеют одинаковый вес. Частотность Wordstat, клики, продажи и доля рынка в расчётах не используются.</li></ul>');
}

<script>
function querySummary(row){
  const first=prodOK(row)?row.products.filter(p=>p.rank===1):[];
  const names=first.map(p=>(p.brands.join(' / ')||'Бренд не определён')+' · '+p.title);
  const recs=aliceOK(row)?[...new Set(selectedAlice(row,'rec').map(a=>a.brand))]:[];
  let answer='Ответ не обнаружен';
  if(!ok(row)||row.as==='not_measured')answer='Нет измерения';
  else if(aliceOK(row))answer=recs.join(', ')||(row.alice.some(a=>a.kind==='unknown')?'Тип записи не указан':'Рекомендация не зафиксирована');
  let firstText=names.join(' / ')||(prodOK(row)?'Нет карточки с позицией 1':'Блок не обнаружен');
  if(!ok(row)||row.ps==='not_measured')firstText='Нет измерения';
  return '<span class="summarylist"><span><strong>Товар № 1</strong> · '+escapeHTML(firstText)+'</span><span><strong>Алиса рекомендует</strong> · '+escapeHTML(answer)+'</span></span>';

function formatView(rows){
  const {columns,brands}=formatStats(rows);
  const standard=['Быстрый ответ','Купить','Алиса · рекомендации','Алиса · упоминания','Веб · заголовки'];
  const labels=[...new Set([...standard.slice(0,2),...[...columns.keys()].filter(l=>!standard.includes(l)),...standard.slice(2)])];
  if(!labels.includes(matrixOrder))matrixOrder='';
  const score=b=>matrixOrder?(b.counts.get(matrixOrder)||0):Math.max(0,...b.counts.values());
  const ordered=[...brands.values()].sort((a,b)=>score(b)-score(a)||collator.compare(a.name,b.name));
  const caption='Каждая ячейка показывает число замеров с брендом и долю среди замеров с данным форматом. Для двух столбцов Алисы база — все обнаруженные ответы.';
  const choose='<label><small>Сортировать по формату</small><select id="matrixOrder">'+options([['','Максимум замеров'],...labels.map(x=>[x,x])],matrixOrder)+'</select></label>';
  function countCell(brand,label){
    const total=columns.get(label)||0,n=brand.counts.get(label)||0;
    if(!total||(label.startsWith('Алиса')&&!data.schema.kind))return num('—');
    const shade=0.04+0.38*n/total;
    return '<td class="num"'+(n?' style="background:rgba(132,189,165,'+shade+')"':'')+'>'+n+' · '+pct(n,total)+'</td>';
  }
  const matrix=table(['Бренд',...labels.map(l=>l+' ('+(columns.get(l)||0)+')')],ordered.map(b=>[cell(b.name),...labels.map(l=>countCell(b,l))]));
  const short=[...columns].filter(([,n])=>n===1).map(([label])=>label);
  const notes=note('Обычная веб-выдача учитывает совпадения со словарём в заголовках. Домен магазина и ссылка в ответе Алисы учитываются отдельно в разделе «Сайты и источники».');
  return '<section class="panel"><div class="panelhead"><div><h2>В каких форматах появляются бренды</h2>'+note(caption)+'</div>'+choose+'</div>'+matrix+notes+(short.length?note('Только один замер в форматах: '+short.join(', ')+'.'):'')+'</section>';
}
function catalogueScope(){
  const category=$('category').value,group=$('subgroup').value,term=norm($('query').value);
  return [...byQuestion.values()].filter(meta=>matchesCategory(meta.category,category)&&(!group||meta.subgroup===group)&&(!term||norm(meta.query).includes(term)));
}
function coveragePanel(rows){
  const planned=catalogueScope(),seen=new Set(rows.filter(ok).map(r=>norm(r.query)));
  const missing=planned.filter(m=>!seen.has(norm(m.query)));
  const outside=new Set(rows.filter(r=>!byQuestion.has(norm(r.query))).map(r=>norm(r.query)));
  const summary='<div class="tilegroup"><span>Проверено по плану <b>'+fmt(planned.length-missing.length)+' / '+fmt(planned.length)+'</b></span><span>Без успешного замера <b>'+fmt(missing.length)+'</b></span><span>Вне справочника <b>'+fmt(outside.size)+'</b></span></div>';
  const detail=missing.length?'<details class="methodbox"><summary>Показать пропущенные формулировки ('+missing.length+')</summary><ul class="missinglist">'+missing.map(m=>'<li>'+escapeHTML(m.query)+'</li>').join('')+'</ul></details>':'';
  return panel('Полнота плана мониторинга','Уникальные формулировки из вашей таблицы категорий. Учитываются успешные замеры с действующими фильтрами.',summary+detail);
}
function categoriesView(rows){
  const sections=[],selected=$('category').value;
  const candidates=[...planGroups.map(g=>g.name)];
  if(data.records.some(r=>categoryOf(r)===unassigned))candidates.push(unassigned);
  const catalog=catalogueScope();
  for(const name of candidates){
    if(!matchesCategory(name,selected))continue;
    const part=rows.filter(r=>categoryOf(r)===name);
    const subs=[...new Set(catalog.filter(meta=>meta.category===name).map(m=>m.subgroup).filter(Boolean))];
    const breakdown=[['',part],...subs.map(s=>[s,part.filter(r=>groupOf(r)===s)])];
    for(const [sub,segment] of breakdown){
      const actual=review(segment,'rec'),bs=[...actual.stats.values()];
      const leaders=field=>bestEntries(bs,b=>b[field]).map(b=>b.name+' ('+b[field]+')').join(', ')||'—';
      const planned=catalog.filter(m=>m.category===name&&(!sub||m.subgroup===sub));
      const counted=new Set(segment.filter(ok).map(r=>norm(r.query)));
      const present=planned.filter(m=>counted.has(norm(m.query))).length;
      const nameCell=sub?'<td>↳ '+escapeHTML(sub)+'</td>':'<td><button class="brandlink catlink" data-category="'+escapeHTML(name)+'">'+escapeHTML(name)+'</button></td>';
      sections.push([nameCell,num(planned.length?present+' / '+planned.length:'—'),num(segment.length),num(actual.pBase),num(actual.aBase),num(data.schema.kind?actual.anyAlice:'—'),cell(leaders('p')),cell(data.schema.kind?leaders('a'):'—')]);
    }
  }
  return panel('Категории и подгруппы','Названия и распределение взяты из вашей скорректированной таблицы. В скобках рядом с лидером указано число замеров. Нажмите на категорию, чтобы применить её ко всем разделам.',table(['Категория','Проверено / план','Замеры','С товарами','С Алисой','С рекомендацией','Лидеры поиска','Лидеры рекомендаций'],sections))+coveragePanel(rows);
}
function syncCategory(makeList=false){
  const cat=$('category'),sub=$('subgroup');
  if(makeList){
    const names=planGroups.map(g=>g.name);
    if(data.records.some(r=>categoryOf(r)===unassigned))names.push(unassigned);
    cat.innerHTML=options([['','Все категории'],[withoutCompetitors,'Все, кроме группы Е'],...names.map(v=>[v,v])]);cat.value='';
  }
  const current=cat.value;
  const subs=[...new Set([...byQuestion.values()].filter(meta=>meta.category===current&&meta.subgroup).map(meta=>meta.subgroup))];
  sub.innerHTML=options([['','Все подгруппы'],...subs.map(v=>[v,v])]);sub.value='';
  $('subWrap').hidden=!subs.length;
}
function stabilityPanel(rows,focus){
  const recurring=seriesByQuery(rows).filter(s=>s.measurements.filter(ok).length>=2);
  if(!recurring.length)return note('Для оценки повторяемости нужны минимум два успешных замера одной формулировки. В этом срезе таких серий нет.');
  function leaderNames(counter){
    const winners=bestEntries(counter,entry=>entry[1]);
    return winners.map(([label,n])=>label+' ('+n+')').join(' / ')||'—';
  }
  const entries=recurring.map(series=>{
    const sample=series.measurements,counts=review(sample,'rec'),byBrand=counts.stats.get(focus);
    const names=new Map([...series.recommended].map(([key,n])=>[counts.stats.get(key)?.name||key,n]));
    const common=[cell(sample[0].query),num(counts.success),cell(leaderNames(series.firstProducts)),cell(leaderNames(names))];
    if(focus)common.push(num((byBrand?.top||0)+' / '+counts.pBase),num(data.schema.kind?(byBrand?.a||0)+' / '+counts.aBase:'—'));
    return common;
  });
  const extra=focus?['Выбранный бренд № 1 / выдачи с товарами','Рекомендован / ответы Алисы']:[];
  return '<h3>Повторяемость по формулировкам</h3>'+note('Число успешных замеров с товаром на первом месте или с рекомендацией бренда. При равенстве показаны все лидеры.')+table(['Запрос','Успешные замеры','Товары № 1','Бренды в рекомендациях',...extra],entries);
}

function positionsPanel(rows){
  const ranks=new Set(),byBrand=new Map();
  let unidentified=0;
  for(const row of rows.filter(prodOK)){
    for(const p of row.products){
      ranks.add(p.rank);
      if(!p.brands.length)unidentified++;
      const names=new Map(p.brands.map(name=>[brandKey(name),name]));
      if(!names.size)names.set('','Бренд не определён');
      for(const [key,name] of names){
        if(!byBrand.has(key))byBrand.set(key,{name,counts:new Map(),cards:0,promo:0,knownPromo:0});
        const b=byBrand.get(key);b.cards++;increment(b.counts,p.rank);
        if(p.promo!==null){b.knownPromo++;if(p.promo)b.promo++;}
      }
    }
  }
  const order=[...ranks].sort((a,b)=>a-b);
  const list=[...byBrand.values()].filter(b=>brandKey(b.name).includes(brandKey(brandSearch))).sort((a,b)=>b.cards-a.cards||collator.compare(a.name,b.name));
  return panel('На каких местах показывают бренд','Количество товарных карточек по сохранённой позиции внутри блока. Карточка с двумя брендами попадает в обе строки.',
    table(['Бренд','Всего карточек',...order.map(n=>'Место '+n),'Промо / с известным признаком'],
      list.map(b=>[cell(b.name),num(b.cards),...order.map(rank=>num(b.counts.get(rank)||0)),num(b.knownPromo?b.promo+' / '+b.knownPromo:'—')]))+
    note('Карточек с пустым полем бренда: '+fmt(unidentified)+'.'));
}

const withoutCompetitors='@without-competitors';
function matchesCategory(name,selected){
  if(selected===withoutCompetitors)return name!=='Отдельная Е. Поиск конкурентов';
  return !selected||selected===name;
}

<script>
// Направления продукции. Правила применяются к тексту каждого результата отдельно.
const familyList=[
  {id:'paste',label:'Чистящая паста',rule:'Паста для бытовой уборки, кухни, сантехники или других поверхностей. Средства для рук, зубов, волос и полировки исключены.'},
  {id:'oxygen',label:'Кислородный отбеливатель',rule:'Нужны указания на отбеливатель и кислородный состав. У средств в форме карандаша или спрея приоритет имеет форма.'},
  {id:'wipes',label:'Салфетки от пятен',rule:'Нужны салфетки и явное назначение для удаления пятен.'},
  {id:'oxygenPen',label:'Кислородный карандаш',rule:'Карандаш или пятновыводящий стик с явным указанием на кислородный состав.'},
  {id:'enzymePen',label:'Энзимный карандаш',rule:'Карандаш или пятновыводящий стик с указанием на энзимы или ферменты.'},
  {id:'kids',label:'Отбеливатель для детских вещей',rule:'Нужны отбеливающее назначение и явная маркировка для детского белья, одежды или вещей. Общие слова о безопасности для детей пропускаются.'},
  {id:'spray',label:'Спрей от пятен',rule:'Спрей или спрей-пятновыводитель с явным назначением для удаления пятен.'},
  {id:'glass',label:'Пена для мытья стёкол',rule:'Нужны пенная форма и назначение для стёкол, окон или зеркал. Один признак «аэрозоль» не определяет пенную форму.'}
];

function familyText(value){
  return norm(value).replace(/[^\p{L}\p{N}]+/gu,' ').trim();
}
function classifyFamilies(value){
  const t=familyText(value);
  if(!t)return [];
  const result=[];
  const stains=/(?:пятновыво|пятн(?:а|о|у|ом|ами|ах)?(?: |$)|пятен|stain(?:s)?(?: |$))/.test(t);
  const bleach=/(?:отбеливател|отбеливающ|для отбеливания|(?:^| )bleach(?:ing)?(?: |$))/.test(t);
  const oxygen=/(?:кислород|перкарбонат|активн\p{L}* кислород|(?:^| )oxygen(?: |$))/u.test(t)&&
    !/(?:без (?:активного )?кислород|бескислород|не кислородн)/.test(t);
  const enzymes=/(?:энзим|фермент)/.test(t)&&
    !/(?:без (?:добавления )?(?:энзим|фермент)|бесфермент|безэнзим|не энзимн)/.test(t);
  const pen=/(?:карандаш|(?:^| )(?:стик(?:а|е|и|ов|ах|ом)?|stick)(?: |$))/.test(t);
  const spray=/(?:спре[йяеюив]|(?:^| )spray(?: |$))/.test(t);
  const foam=/(?:^| )(?:пен(?:а|ы|у|е|ой|ою|ки|ка|ку)|пенн\p{L}*|foam(?:ing)?)(?: |$)/u.test(t);
  const glass=/(?:^| )(?:стек(?:л(?:о|а|у|ом|е|ами|ах|ы)?|ол|ольн\p{L}*)|ок(?:он|на|но|нам|нах)|зеркал\p{L}*|glass|windows?)(?: |$)/u.test(t);
  const paste=/(?:^| )паст(?:а|ой|ою|у|е|ы|ами|ах)?(?: |$)/.test(t);
  const home=/(?:чистящ|для (?:чистки|очистки|уборки|мытья)|очищающ|уборк|поверхност|кухн|сантехник|кафел|нагар|сковород|известков|чудо паст)/.test(t);
  const nonHome=/(?:зубн|для (?:очистки |чистки )?(?:рук|зубов|волос)|для полировк|полировальн|термопаст|сахарная паста|депиляц)/.test(t);
  if(paste&&home&&!nonHome)result.push('paste');
  if(oxygen&&bleach&&!pen&&!spray)result.push('oxygen');
  if(/салфет/.test(t)&&stains)result.push('wipes');
  if(pen&&oxygen)result.push('oxygenPen');
  if(pen&&enzymes)result.push('enzymePen');
  const kidsLabel=/(?:детск\p{L}* (?:кислородн\p{L}* )?отбеливател|(?:отбеливател\p{L}*|отбеливающ\p{L}* средств\p{L}*|отбеливани\p{L}*) (?:для )?детск\p{L}* (?:вещ|бел|одежд|ткан)|(?:^| )(?:для|специально для) (?:стирки |отбеливания )?детск\p{L}* (?:вещ|бел|одежд|ткан))/u.test(t);
  const kidsExclusion=/(?:не (?:подходит|предназначен\p{L}*|рекоменду\p{L}*|использ\p{L}*) (?:для )?(?:стирки )?детск|не для детск|безопас\p{L}* для (?:аллергиков и )?детск)/u.test(t);
  if(bleach&&kidsLabel&&!kidsExclusion&&!pen&&!spray)result.push('kids');
  if(spray&&stains)result.push('spray');
  if(foam&&glass&&!paste)result.push('glass');
  return result;
}

const classifiedMeasurements=new WeakMap();
function familyEvidence(row){
  if(classifiedMeasurements.has(row))return classifiedMeasurements.get(row);
  const evidence=new Map(familyList.map(f=>[f.id,{direct:false,products:[],alice:[],web:[]}]));
  for(const id of classifyFamilies(row.query))evidence.get(id).direct=true;
  let unmatchedCards=0,unmatchedAlice=0;
  if(prodOK(row)){
    for(const product of row.products){
      const ids=classifyFamilies(product.title);
      if(!ids.length)unmatchedCards++;
      for(const id of ids)evidence.get(id).products.push(product);
    }
  }
  if(aliceOK(row)){
    for(const item of row.alice.filter(a=>a.kind==='recommendation')){
      // Поле query не участвует в атрибуции товара. В заголовке раздела может быть указан его вид.
      const ids=classifyFamilies([item.section,item.evidence].filter(Boolean).join(' '));
      if(!ids.length)unmatchedAlice++;
      for(const id of ids)evidence.get(id).alice.push(item);
    }
  }
  if(ok(row)){
    for(const page of row.web)for(const id of classifyFamilies(page.title))evidence.get(id).web.push(page);
  }
  const classified={evidence,unmatchedCards,unmatchedAlice};
  classifiedMeasurements.set(row,classified);
  return classified;
}

function familyReport(rows){
  const entries=familyList.map(f=>({...f,hits:[],reach:0,search:0,ai:0,web:0,cards:0,first:0,direct:0,directHit:0,
    directMeasured:0,directMiss:0,directPartial:0}));
  let unmatchedCards=0,unmatchedAlice=0,aiEntries=0,success=0,measuredAny=0,searchMeasured=0,aliceMeasured=0,webBase=0;
  for(const row of rows){
    const classified=familyEvidence(row);
    unmatchedCards+=classified.unmatchedCards;
    unmatchedAlice+=classified.unmatchedAlice;
    if(ok(row))success++;

    if(aliceOK(row)){

      aiEntries+=row.alice.filter(a=>a.kind==='recommendation').length;
    }
    if(ok(row)&&row.web.length)webBase++;
    const measuredP=ok(row)&&['observed','not_detected'].includes(row.ps);
    const hasBrandField=Array.isArray(data.original?.[row.id]?.alice_brands);
    const typedAnswer=row.alice.length?row.alice.every(a=>a.kind!=='unknown'):(hasBrandField||data.schema.kind);
    const measuredA=ok(row)&&(row.as==='not_detected'||(row.as==='observed'&&typedAnswer));
    if(measuredP)searchMeasured++;
    if(measuredA||row.alice.some(a=>aliceOK(row)&&a.kind==='recommendation'))aliceMeasured++;
    if(measuredP||measuredA||(aliceOK(row)&&row.alice.some(a=>a.kind==='recommendation')))measuredAny++;
    for(const f of entries){
      const hit=classified.evidence.get(f.id);
      const product=hit.products.length>0,ai=hit.alice.length>0,appeared=product||ai;
      if(product)f.search++;
      if(ai)f.ai++;
      if(appeared)f.reach++;
      if(hit.web.length)f.web++;
      if(hit.products.some(p=>p.rank===1))f.first++;
      f.cards+=hit.products.length;
      if(hit.direct){
        f.direct++;
        if(measuredP&&measuredA){
          f.directMeasured++;
          if(appeared)f.directHit++;else f.directMiss++;
        }else f.directPartial++;
      }
      if(hit.direct||appeared||hit.web.length)f.hits.push({row,...hit,measuredP,measuredA});
    }
  }
  return {entries,unmatchedCards,unmatchedAlice,aiEntries,success,measuredAny,searchMeasured,aliceMeasured,webBase};
}

let currentFamily='paste',familySort='reach',familyScope='all';
const familyCellValue=(n,available)=>available?fmt(n):'—';
function familyQueryStatus(hit){
  if(hit.products.length&&hit.alice.length)return 'Товар и рекомендация';
  if(hit.products.length)return 'Показана карточка';
  if(hit.alice.length)return 'Рекомендация Алисы';
  if(hit.measuredP&&hit.measuredA)return 'Совпадений в двух каналах нет';
  return 'Данные по каналам неполны';
}
function familyRankTable(families,summary){
  const fields={reach:'Хотя бы один канал',search:'Поиск',ai:'Алиса',first:'Место № 1',directMiss:'Пропуски по прямым запросам'};
  const sorted=[...families].sort((a,b)=>b[familySort]-a[familySort]||b.reach-a.reach||collator.compare(a.label,b.label));
  const controls='<label><small>Рейтинг по показателю</small><select id="familySort">'+options(Object.entries(fields),familySort)+'</select></label>';
  const seen=summary.measuredAny>0;
  const rows=sorted.map(f=>{
    const active=currentFamily===f.id;
    const reachValue=fmt(f.reach)+' · '+pct(f.reach,summary.success);
    return ['<td><button class="family-button" aria-pressed="'+active+'" data-family="'+f.id+'">'+escapeHTML(f.label)+'</button></td>',
      '<td class="family-reach"><b>'+ (seen?reachValue:'—')+'</b><span aria-hidden="true"><i style="width:'+rate(f.reach,summary.success)+'%"></i></span></td>',
      num(familyCellValue(f.search,summary.searchMeasured)),num(familyCellValue(f.ai,summary.aliceMeasured)),num(familyCellValue(f.cards,summary.searchMeasured)),
      num(familyCellValue(f.first,summary.searchMeasured)),num(familyCellValue(f.web,summary.webBase)),num(f.directMeasured?f.directHit+' / '+f.directMeasured:'—')];
  });
  return '<section class="panel"><div class="panelhead"><div><h2>Какие направления появляются в выдаче</h2>'+note('Охват — число успешных замеров с подходящей карточкой или рекомендацией Алисы. При совпадении в обоих каналах замер учитывается один раз.')+'</div>'+controls+'</div>'+
    table(['Направление','Охват / доля всех успешных','Поиск · замеры','Алиса · ответы','Карточки','№ 1 · замеры','Веб-заголовки · замеры','По прямым запросам¹'],rows)+
    note('¹ Попадания хотя бы в одном канале / прямые замеры с известным состоянием обоих каналов. Веб-заголовки считаются отдельно. Ноль означает отсутствие распознанного совпадения, прочерк — отсутствие базы для показателя.')+'</section>';
}
function familyBrandAndProduct(hits){
  const brands=new Map(),items=new Map();
  function bucket(name){
    const k=brandKey(name);
    if(!brands.has(k))brands.set(k,{name,search:0,ai:0});
    return brands.get(k);
  }
  for(const hit of hits){
    const seenProducts=new Set(),seenBrands=new Set(),seenAi=new Set();
    for(const p of hit.products){
      const k=norm(p.title);
      if(!items.has(k))items.set(k,{name:p.title,brands:new Set(),cards:0,first:0,runs:0});
      const v=items.get(k);v.cards++;
      if(p.rank===1)v.first++;
      if(!seenProducts.has(k)){v.runs++;seenProducts.add(k);}
      for(const b of p.brands){
        v.brands.add(b);const brand=bucket(b);
        if(!seenBrands.has(brand)){brand.search++;seenBrands.add(brand);}
      }
    }
    for(const a of hit.alice){
      const brand=bucket(a.brand);
      if(!seenAi.has(brand)){brand.ai++;seenAi.add(brand);}
    }
  }
  const list=[...items.values()].sort((a,b)=>b.runs-a.runs||b.first-a.first||collator.compare(a.name,b.name));
  const ranked=[...brands.values()].sort((a,b)=>Math.max(b.search,b.ai)-Math.max(a.search,a.ai)||collator.compare(a.name,b.name));
  const products=list.length?table(['Товар','Бренд из карточки','Замеры','Показы','№ 1'],list.map(p=>[cell(p.name),cell([...p.brands].join(', ')||'Не указан'),num(p.runs),num(p.cards),num(p.first)])):empty('Совпавших товарных карточек в выбранной выборке нет.');
  const brandTable=ranked.length?table(['Бренд','Поиск · замеры','Алиса · ответы'],ranked.map(b=>[cell(b.name),num(b.search),num(b.ai)])):empty('В совпавших карточках и рекомендациях нет распознанных брендов.');
  return '<div class="pair">'+panel('Конкретные товары','Названия и позиции совпавших карточек.',products)+panel('Бренды направления','Один бренд учитывается один раз за замер в каждом канале.',brandTable)+'</div>';
}
function familyTrace(hit){
  const r=hit.row;
  const lines=(items,build,fallback)=>items.length?'<ul>'+items.map(v=>'<li>'+build(v)+'</li>').join('')+'</ul>':note(fallback);
  const products=lines(hit.products,p=>'<b>№ '+escapeHTML(p.rank)+'</b> · '+escapeHTML(p.title)+'<div class="hint">'+escapeHTML([p.brands.join(', '),p.price,p.seller].filter(Boolean).join(' · '))+'</div>','Подходящая карточка не распознана.');
  const alice=lines(hit.alice,a=>'<b>'+escapeHTML(a.brand)+'</b> '+escapeHTML(a.section)+'<div class="evidence">'+escapeHTML(a.evidence)+'</div>','Для направления нет распознанной рекомендации.');
  const web=lines(hit.web,w=>'№ '+escapeHTML(w.rank)+' · '+escapeHTML(w.title),'Совпадений в сохранённых заголовках нет.');
  const detail='<div class="detailgrid"><div><h3>Карточки направления</h3>'+products+'</div><div><h3>Рекомендации Алисы</h3>'+alice+'</div></div>'+
    (hit.web.length?'<h3>Совпадения в веб-выдаче</h3>'+web:'')+
    '<details class="query"><summary>Весь исходный замер</summary><div class="detail" data-row="'+r.id+'"></div></details>';
  return '<details class="family-trace"><summary><strong>'+escapeHTML(r.query)+'</strong> <small>· № '+escapeHTML(r.number||r.id+1)+' · '+escapeHTML(r.date)+' · '+(hit.direct?'прямой запрос':'другой запрос')+'</small><span>'+escapeHTML(familyQueryStatus(hit))+'</span></summary>'+detail+'</details>';
}
function familyView(rows){
  const report=familyReport(rows),f=report.entries.find(x=>x.id===currentFamily);
  const relevant=f.hits.filter(h=>familyScope==='all'||(familyScope==='direct'&&h.direct)||(familyScope==='miss'&&h.direct&&h.measuredP&&h.measuredA&&!h.products.length&&!h.alice.length)||(familyScope==='other'&&!h.direct));
  const only=report.entries.filter(x=>x.reach===0).map(x=>x.label);
  const noHits=report.measuredAny&&only.length?note('Без распознанных появлений в карточках и рекомендациях: '+only.join(', ')+'.'):'';
  const select='<label><small>Подробный разбор</small><select id="currentFamily">'+options(familyList.map(x=>[x.id,x.label]),currentFamily)+'</select></label>';
  const scopes=[['all','Все связанные замеры'],['direct','Прямые запросы'],['miss','Прямые запросы без попадания'],['other','Другие запросы']];
  const summary='<div class="tilegroup"><span>Прямые замеры <b>'+f.direct+'</b></span><span>Прямые с совпадением¹ <b>'+f.directHit+'</b></span><span>Прямые без совпадения <b>'+f.directMiss+'</b></span><span>Прямые с неполными данными <b>'+f.directPartial+'</b></span></div>';
  const detail='<section class="panel" id="familyDetail"><div class="panelhead"><div><h2>'+escapeHTML(f.label)+'</h2>'+note(f.rule)+'</div>'+select+'</div>'+summary+'</section>';
  const trace='<section class="panel"><div class="panelhead"><div><h2>Запросы и подтверждения</h2>'+note('Всего в выбранном списке: '+relevant.length+'. Раскройте замер, чтобы проверить точный текст.')+'</div><label><small>Показать замеры</small><select id="familyScope">'+options(scopes,familyScope)+'</select></label></div>'+(relevant.length?relevant.map(familyTrace).join(''):empty('Замеров для этого списка нет.'))+'</section>';
  const missing=note('Вне восьми направлений или без достаточных признаков: '+report.unmatchedCards+' товарных карточек, '+report.unmatchedAlice+' записей Алисы с типом recommendation из '+report.aiEntries+'.');
  const method='<details class="methodbox"><summary>Как определяются направления</summary><p class="hint">Названия сопоставляются по форме, составу и назначению. Для Алисы используются заголовок раздела и цитата записи с типом recommendation. Текст запроса определяет только признак «прямой запрос». Общий «карандаш от пятен» не указывает состав. Кислородный отбеливатель для детского белья может попасть в две строки. Пропуск относится к сохранённым результатам этого замера.</p></details>';
  return familyRankTable(report.entries,report)+noHits+detail+familyBrandAndProduct(f.hits)+trace+panel('Полнота классификации','В рейтинге участвуют совпадения по тексту. Общие названия и записи без точного назначения могут остаться без направления.',missing+method);
}

</script>
<script>
const tabs={overview,families:familyView,brands:brandTable,formats:formatView,segments:categoriesView,products:productView,queries:queryView,sources:sourceView,quality};
function render(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===activeTab)));
  if(!sourceKind){
    $('kpis').innerHTML='';
    $('view').innerHTML=panel('Загрузите данные мониторинга','Сайт открывает соседний combined.json автоматически. Для просмотра с компьютера выберите файл кнопкой вверху.','');
    return;
  }
  const rows=filtered(),stats=review(rows,mode);
  $('kpis').innerHTML=kpis(rows,stats);
  $('view').innerHTML=tabs[activeTab](rows,stats);

  if($('from').value&&$('to').value&&$('from').value>$('to').value)$('view').innerHTML=empty('Начальная дата позже конечной. Измените период.');
}
function install(dataset,kind,name){
  data=dataset;sourceKind=kind;sourceName=name;mode=data.schema.kind?'rec':'all';
  drill='';trendBrand='';brandSearch='';sortBy='reach';cover='all';scopedProduct='';matrixOrder='';chartLimit='10';currentFamily='paste';familySort='reach';familyScope='all';syncCategory(true);
  const engines=[...new Set(data.records.map(r=>r.engine))].sort(collator.compare);
  $('engine').innerHTML=options([['','Все'],...engines.map(e=>[e,e])]);
  for(const id of ['query','from','to'])$(id).value='';
  const prefix={file:'Локальный файл',remote:'Файл по ссылке',snapshot:'Сохранённый снимок'}[kind];
  $('origin').innerHTML='<strong>'+escapeHTML(prefix)+'</strong> · '+escapeHTML(name)+' · '+fmt(data.records.length)+' замеров';
  const dates=[...new Set(data.records.map(r=>r.date).filter(Boolean))].sort();
  $('period').textContent=dates.length?'Период наблюдений · '+[dates[0],...(dates.length>1?[dates[dates.length-1]]:[])].map(d=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(d+'T00:00:00Z'))).join(' — '):'';
  const notices=[];
  if(!data.schema.kind)notices.push('Тип записи Алисы отсутствует. Показаны все записи о брендах; выделить подтверждённые рекомендации по этим данным нельзя.');
  if(!data.schema.pBrand)notices.push('Бренды товаров определены по словарю в названиях.');
  $('notice').textContent=notices.join(' ');$('notice').hidden=!notices.length;
  $('save').hidden=false; render();
}
function readURL(raw){
  const u=new URL(raw,document.baseURI);
  if(!['https:','http:'].includes(u.protocol))throw Error('Нужна ссылка HTTP или HTTPS.');
  if(u.hostname==='drive.google.com'){
    const id=u.pathname.match(/^\/file\/d\/([\w-]+)/)?.[1]||u.searchParams.get('id');
    if(id){const v=new URL('/uc',u.origin);v.searchParams.set('export','download');v.searchParams.set('id',id);
      if(u.searchParams.has('resourcekey'))v.searchParams.set('resourcekey',u.searchParams.get('resourcekey'));
      return v.href;}
  }
  if(u.hostname==='docs.google.com'&&/^\/spreadsheets\/d\/[\w-]+\/(?:edit|view)/.test(u.pathname)){
    const v=new URL(u.pathname.replace(/\/(?:edit|view).*$/,'/export'),u.origin);
    v.searchParams.set('format','csv');const gid=u.searchParams.get('gid')||new URLSearchParams(u.hash.slice(1)).get('gid');
    if(gid)v.searchParams.set('gid',gid);return v.href;
  }
  return u.href;
}
function initLink(){
  try{const u=new URL(DATA_URL,document.baseURI);if(!['http:','https:'].includes(u.protocol))throw Error();
    $('sourceLink').href=u.href;
  }catch{$('sourceLink').hidden=true;}
}
let controller;
async function reload(){
  const token=++generation;
  if(controller)controller.abort();controller=new AbortController();
  const own=controller,timeout=setTimeout(()=>own.abort(),10000);
  $('refresh').disabled=true;$('message').textContent='Загружаю данные…';
  try{
    const response=await fetch(readURL(DATA_URL),{signal:own.signal,credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});
    if(!response.ok)throw Error('HTTP '+response.status);
    const dataset=readReport(await response.text());
    if(token!==generation)return;
    install(dataset,'remote',new URL(DATA_URL,document.baseURI).pathname.split('/').pop()||'файл данных');
    $('message').textContent='Прочитано записей: '+dataset.records.length+'.';
  }catch(e){
    if(token===generation)$('message').textContent='Автозагрузка не удалась. Выберите файл кнопкой «Открыть JSON или CSV». '+(e.name==='AbortError'?'Истекло время ожидания.':e.message);
  }finally{clearTimeout(timeout);if(token===generation)$('refresh').disabled=false;}
}
function safeJSON(value){return JSON.stringify(value).replace(/</g,'\\u003c').replace(/&/g,'\\u0026');}
function saveSnapshot(){
  const root=document.documentElement.cloneNode(true);
  const snapshot=data.sourceText!==undefined?{jsonText:data.sourceText}:{dataset:data};
  root.querySelector('#embedded').textContent=safeJSON({kind:'snapshot',url:DATA_URL,name:sourceName,...snapshot});
  for(const id of ['view','kpis','notice','origin','message','engine'])root.querySelector('#'+id).replaceChildren();
  root.querySelector('#refresh').removeAttribute('disabled');
  const blob=new Blob(['<!doctype html>\n',root.outerHTML],{type:'text/html;charset=utf-8'});
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='index.html';
  link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);
}
$('file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  const token=++generation;if(controller)controller.abort();$('refresh').disabled=false;
  try{const dataset=readReport(await f.text(),f.name);if(token!==generation)return;
    install(dataset,'file',f.name);$('message').textContent='Прочитано записей: '+dataset.records.length+'.';
  }catch(err){if(token===generation)$('message').textContent='Не удалось открыть файл. '+err.message;}
  finally{e.target.value='';}
});
$('refresh').addEventListener('click',reload);$('save').addEventListener('click',saveSnapshot);
$('reset').addEventListener('click',()=>{
  for(const id of ['engine','query','from','to'])$(id).value='';
  drill='';trendBrand='';brandSearch='';cover='all';sortBy='reach';chartLimit='10';matrixOrder='';scopedProduct='';currentFamily='paste';familySort='reach';familyScope='all';syncCategory(true);mode=data.schema.kind?'rec':'all';render();
});
$('category').addEventListener('change',()=>{syncCategory();render();});
for(const id of ['engine','from','to','subgroup'])$(id).addEventListener('change',render);
$('query').addEventListener('input',render);
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]'),brand=e.target.closest('[data-brand]');
  const family=e.target.closest('[data-family]');
  if(family){
    currentFamily=family.dataset.family;familyScope='all';render();
    $('familyDetail').scrollIntoView({block:'start'});
  }
  if(tab){activeTab=tab.dataset.tab;render();}
  const product=e.target.closest('[data-product]'),category=e.target.closest('[data-category]');
  if(product){scopedProduct=product.dataset.product;drill='';cover='all';activeTab='queries';render();document.querySelector('nav').scrollIntoView({block:'start'});}
  if(e.target.closest('[data-clear-product]')){scopedProduct='';render();}
  if(category){$('category').value=category.dataset.category;syncCategory();render();}
  if(brand){scopedProduct='';drill=brand.dataset.brand;cover='all';activeTab='queries';render();document.querySelector('nav').scrollIntoView({block:'start'});}
});
$('view').addEventListener('change',e=>{
  const id=e.target.id,val=e.target.value;
  if(id==='mode')mode=val;else if(id==='sortBy')sortBy=val;else if(id==='drill')drill=val;
  else if(id==='cover')cover=val;else if(id==='trendBrand')trendBrand=val;else if(id==='chartLimit')chartLimit=val;else if(id==='matrixOrder')matrixOrder=val;
  else if(id==='familySort')familySort=val;
  else if(id==='familyScope')familyScope=val;
  else if(id==='currentFamily'){currentFamily=val;familyScope='all';}
  else return;
  render();
});
$('view').addEventListener('input',e=>{
  if(e.target.id!=='brandSearch')return;
  const pos=e.target.selectionStart;brandSearch=e.target.value;render();
  const field=$('brandSearch');field.focus();field.setSelectionRange(pos,pos);
});
$('view').addEventListener('toggle',e=>{
  if(!e.target.matches('details.query')||!e.target.open)return;
  const target=e.target.querySelector('.detail');
  if(!target.childElementCount)target.innerHTML=queryDetail(data.records[Number(target.dataset.row)]);
},true);
initLink();
const embed=JSON.parse($('embedded').textContent);
const linked = !$('sourceLink').hidden;
$('refresh').hidden=!linked;
if(embed?.kind==='snapshot'&&embed.url===DATA_URL){
  install(embed.jsonText!==undefined?parseMonitorJSON(embed.jsonText):embed.dataset,'snapshot',embed.name);
}else{
  $('origin').textContent='Откройте combined.json, чтобы увидеть статистику.';
  $('engine').innerHTML=options([['','Все']]); render();
  if(linked)reload();
}

</script>
